<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FBF3F7"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Cozy Places"><meta name="description" content="Decorate a café, a campsite, a library and a whole house."></head><body>
<title>Cozy Places</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one soft column — place tabs, the scene as a framed stage, a gentle toolbox, then that place's furniture. Single pastel look by choice. */
:root{
  --page:#FBF3F7;
  --panel:#FFFAF6;
  --ink:#5B4B6B;
  --ink-soft:#8E7FA0;
  --pink:#F4A9C0;
  --pink-deep:#E58AA8;
  --mint:#BFE6D6;
  --lav:#D9C8F0;
  --line:#EEDDE8;
  --display:"Gaegu","Comic Sans MS",cursive;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;margin:0;letter-spacing:.5px}
.sub{margin:4px 0 0;color:var(--ink-soft);font-size:.92rem}

.places{display:flex;flex-wrap:wrap;gap:8px}
.places button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px}
.places button svg{width:30px;height:30px;flex:none}
.places button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.rooms{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 10px}
.sizes{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-bottom:8px;margin-bottom:2px;border-bottom:1px dashed var(--line)}
.sizes button{padding:5px 14px;font-size:.85rem}
.sizes button[aria-pressed="true"]{background:var(--lav);border-color:var(--lav)}
.rooms .label{min-width:0;padding-inline:4px}
.rooms button{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;font-size:.88rem}
.rooms button svg{width:24px;height:24px;flex:none}
.rooms button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint)}

.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:24px;overflow:hidden;
  box-shadow:0 10px 30px rgba(140,100,150,.18),inset 0 0 0 6px #fff;user-select:none;-webkit-user-select:none;touch-action:none}
.wall{position:absolute;left:0;right:0;top:0;transition:filter .6s}
.floor{position:absolute;left:0;right:0;bottom:0;transition:filter .6s}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:#fff;opacity:.9}
.stage[data-scene="camp"] .floor::before{display:none}
.scenery{position:absolute;inset:0;pointer-events:none;transition:filter .6s}
.scenery svg{position:absolute;inset:0;width:100%;height:100%}
.wains.splash{top:42%;height:20%;background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(190,214,204,.8) 26px 28px),repeating-linear-gradient(0deg,transparent 0 13px,rgba(190,214,204,.8) 13px 15px),#F6FCF9}
.sunwin{position:absolute;left:4%;right:4%;top:6%;height:50%;display:flex;gap:2%}
.sunwin i{flex:1;border-radius:60px 60px 6px 6px;border:6px solid #fff;background:linear-gradient(#C9E2F7,#EAF4FB);transition:background .6s;box-shadow:inset 0 -14px 0 rgba(191,230,214,.7)}
.stage.night .sunwin i{background:radial-gradient(circle at 30% 30%,#FFF5C9 0 1.5px,transparent 2.5px) 0 0/22px 22px,#4F4C86}
.btiles{position:absolute;left:0;right:0;top:38%;height:24%;border-top:7px solid #fff;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.95) 0 2px,transparent 2px 18px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.95) 0 2px,transparent 2px 40px) 0 0/100% 36px no-repeat,
    linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4));}
.btiles::before{content:"";position:absolute;inset:0;background-image:
    linear-gradient(to bottom,transparent 0 18px,#0000 18px),
    repeating-linear-gradient(90deg,transparent 0 20px,rgba(255,255,255,.95) 20px 22px,transparent 22px 40px);
  -webkit-mask:repeating-linear-gradient(0deg,#000 0 18px,transparent 18px 36px);mask:repeating-linear-gradient(0deg,#000 0 18px,transparent 18px 36px)}
.btiles{background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.95) 0 2px,transparent 2px 18px),
    linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4))}
.btiles::before{-webkit-mask:repeating-linear-gradient(0deg,transparent 0 18px,#000 18px 36px);mask:repeating-linear-gradient(0deg,transparent 0 18px,#000 18px 36px);background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.95) 38px 40px)}
.btiles>i{position:absolute;inset:0;-webkit-mask:repeating-linear-gradient(0deg,#000 0 18px,transparent 18px 36px);mask:repeating-linear-gradient(0deg,#000 0 18px,transparent 18px 36px);background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.95) 18px 20px,transparent 20px 40px)}
.btiles::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:6%;min-height:6px;background:rgba(140,120,160,.18)}
.stage[data-scene="bath"] .floor{box-shadow:inset 0 14px 18px -10px rgba(110,90,130,.28)}
.wains{position:absolute;left:0;right:0;top:45%;height:17%;
  background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(214,196,210,.7) 22px 23.5px),repeating-linear-gradient(0deg,transparent 0 11px,rgba(214,196,210,.7) 11px 12.5px),#FFF8F3;border-top:5px solid #fff}
.rail{position:absolute;left:0;right:0;top:24%;height:4px;background:rgba(255,255,255,.75)}
.crown{position:absolute;left:0;right:0;top:0;height:5%;background:linear-gradient(#CDA27D,#D9B08C);border-bottom:3px solid #E3C2A4}
.panels{position:absolute;left:0;right:0;top:40%;height:22%;border-top:5px solid #D9B08C;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 10px,rgba(255,255,255,.35) 10px 12px,rgba(255,255,255,0) 12px 64px,rgba(110,70,60,.10) 64px 66px,rgba(255,255,255,0) 66px 76px),rgba(150,105,80,.16)}

.item{position:absolute;touch-action:none;cursor:grab;transition:filter .6s}
.item:active{cursor:grabbing}
.item svg{display:block;width:100%;height:auto;overflow:visible}
.item .flip{transform-origin:center;transition:transform .45s cubic-bezier(.4,1.5,.5,1)}
.item.flipped .flip{transform:scaleX(-1)}
.item.turning .flip{transform:scaleX(0);transition-duration:.2s}
.item.sel{outline:2px dashed var(--pink-deep);outline-offset:5px;border-radius:10px}

/* lights off */
.stage.night .wall,.stage.night .floor,.stage.night .scenery{filter:brightness(.58) saturate(.8) hue-rotate(-10deg)}
.stage.night[data-scene="camp"] .wall{filter:brightness(.42) saturate(1.1) hue-rotate(20deg)}
.stage.night .item:not(.glow){filter:brightness(.62) saturate(.85)}
.stage.night .item.glow{filter:drop-shadow(0 0 10px rgba(255,224,150,.95)) drop-shadow(0 0 28px rgba(255,200,130,.6))}
.sky{fill:#C9E2F7;transition:fill .6s}
.stage.night .sky{fill:#4F4C86}
.stars{opacity:0;transition:opacity .6s}
.stage.night .stars{opacity:1}
.stage.night .scenery .stars{filter:brightness(1.8)}
.clouds{transition:opacity .6s}
.stage.night .clouds{opacity:.15}
.stage.night[data-scene="camp"] .scenery{filter:brightness(.72) saturate(.9)}
.zz{font-family:var(--display);font-weight:700;fill:#8E7FA0;animation:zz 3s ease-in-out infinite}
.zz.b{animation-delay:1.5s}
@keyframes zz{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.twinkle{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);min-width:54px}
button{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;transition:transform .15s, background .2s, border-color .2s}
button:hover{border-color:var(--pink)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
button:disabled{opacity:.4;cursor:default;transform:none}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--pink-deep)}
.tools button{flex:1 1 auto}
.spacer{flex:1}
.warn{border-color:var(--pink);color:var(--pink-deep)}

.tray-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tray-head h2{font-family:var(--display);font-size:1.6rem;margin:0;font-weight:700}
.tray-head small{color:var(--ink-soft);font-size:.82rem}
#tray{display:flex;flex-direction:column;gap:14px}
.group h3{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);margin:0 0 8px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;border-radius:16px;padding:10px 6px 8px;height:104px;background:#fff}
.tile .pic{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.tile .pic svg{max-width:62px;max-height:58px;width:auto;height:100%;overflow:visible}
.tile span{font-size:.75rem;font-weight:700;line-height:1.1;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;border:1.5px solid var(--pink);padding:10px 18px;border-radius:99px;font-weight:700;box-shadow:0 8px 24px rgba(140,100,150,.2);opacity:0;pointer-events:none;transition:all .4s;max-width:calc(100% - 32px);text-align:center;z-index:9999}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
.pend{transform-box:fill-box;transform-origin:50% 0;animation:swing 1.6s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.fridge-open{background:var(--mint);border-color:var(--mint)}
.overlay{position:fixed;inset:0;z-index:5000;background:rgba(91,75,107,.35);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.fcard{width:100%;max-width:560px;background:var(--panel);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(91,75,107,.3);animation:rise .35s ease}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fhead h2{font-family:var(--display);font-size:1.9rem;margin:0;line-height:1}
.fhead p{margin:2px 0 0;font-size:.82rem;color:var(--ink-soft)}
.fbody{display:flex;justify-content:center}
.fframe{position:relative;width:min(100%,360px);background:#C9E2F7;border-radius:26px;padding:12px;box-shadow:inset 0 -6px 0 #B7D2EC}
.fin{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 0%,#FFFDF2 0 25%,transparent 60%),linear-gradient(#F4FAFF,#E4F1F8)}
.fin .bulb{position:absolute;left:50%;top:0;width:22%;height:3%;transform:translateX(-50%);background:#FFF3C8;border-radius:0 0 10px 10px;box-shadow:0 0 24px 8px rgba(255,243,200,.8)}
.fin .shelf{position:absolute;left:0;right:0;height:2.2%;background:rgba(255,255,255,.85);border-bottom:2px solid rgba(183,210,236,.9);box-shadow:0 3px 6px rgba(150,180,210,.25)}
.fin .crisper{position:absolute;bottom:2%;height:24%;width:47%;border-radius:10px;background:rgba(191,230,214,.35);border:2px solid rgba(255,255,255,.9);box-shadow:inset 0 -14px 0 rgba(191,230,214,.35)}
.fin .crisper::after{content:"";position:absolute;left:30%;right:30%;top:8%;height:6%;border-radius:4px;background:rgba(255,255,255,.9)}
.food{position:absolute;touch-action:none;cursor:grab;transition:left .5s cubic-bezier(.4,1.3,.5,1),top .5s cubic-bezier(.4,1.3,.5,1)}
.food.dragging{transition:none}
.food svg{display:block;width:100%;height:auto;overflow:visible}
.food.sel{outline:2px dashed var(--pink-deep);outline-offset:3px;border-radius:8px}
.ftools{display:flex;flex-wrap:wrap;gap:8px}
.ftools button{flex:1 1 auto}
.ftray{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.ftray .tile{height:84px}
.ftray .tile .pic svg{max-width:44px;max-height:40px}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Cozy Places</h1>
      <p class="sub">pick a place · tap a thing to add it · drag to move</p>
    </div>
  </header>

  <div class="places" id="places" role="group" aria-label="places"></div>
  <div class="rooms" id="rooms" role="group" aria-label="rooms in your home" hidden><div class="sizes" id="sizes"><span class="label">house size</span></div><span class="label">rooms</span></div>

  <div class="stage" id="stage">
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="scenery" id="scenery"></div>
    <div id="items"></div>
  </div>

  <div class="panel">
    <div class="row tools">
      <span class="label">Selected</span>
      <button id="smaller" disabled>smaller</button>
      <button id="bigger" disabled>bigger</button>
      <button id="flipBtn" disabled>flip</button>
      <button id="turnBtn" disabled>turn around ↻</button>
      <button id="remove" disabled>put away</button>
    </div>
    <div class="row">
      <span class="label" id="wallLabel">Walls</span>
      <div class="row" id="walls"></div>
    </div>
    <div class="row">
      <span class="label" id="floorLabel">Floor</span>
      <div class="row" id="floors"></div>
      <span class="spacer"></span>
      <button id="fridgeBtn" class="fridge-open" hidden>organize the fridge 🧊</button>
      <button id="lights">turn lights off ☾</button>
      <button id="clear">start over</button>
    </div>
  </div>

  <div class="panel">
    <div class="tray-head"><h2 id="trayTitle">café things</h2><small>everything is yours, no rush</small></div>
    <div id="tray"></div>
  </div>
</div>
<div class="overlay" id="fridgeView" hidden role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="fcard">
    <div class="fhead"><div><h2 id="fTitle">your fridge</h2><p>tap food to put it in · drag to move it around</p></div><button id="fClose">close fridge</button></div>
    <div class="fbody"><div class="fframe"><div class="fin" id="fin">
      <div class="bulb"></div>
      <div class="shelf" style="top:24%"></div><div class="shelf" style="top:47%"></div><div class="shelf" style="top:72%"></div>
      <div class="crisper" style="left:2%"></div><div class="crisper" style="right:2%"></div>
      <div id="foods"></div>
    </div></div></div>
    <div class="ftools">
      <button id="fTidy">tidy up ✨</button>
      <button id="fOut" disabled>take it out</button>
      <button id="fEmpty">empty fridge</button>
    </div>
    <div id="fTray"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

const BACK_R={};
for(const k in BACK){const m=BACK[k].match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);BACK_R[k]=m[2]/m[1];}
// turning order: front → side → back → other side → front
function viewsOf(id){const v=[["front",false]];if(SIDE[id])v.push(["side",false]);if(BACK[id])v.push(["back",false]);if(SIDE[id])v.push(["side",true]);return v;}

const ratioOf=p=>(p.view==="side"&&SIDE[p.id])?SIDE_R[p.id]:(p.view==="back"&&BACK[p.id])?BACK_R[p.id]:BY[p.id].ratio;
const artOf=p=>(p.view==="side"&&SIDE[p.id])?SIDE[p.id]:(p.view==="back"&&BACK[p.id])?BACK[p.id]:S[p.id];
const hPct=p=>p.w*ratioOf(p)*aspect();
const zOf=p=>{const it=BY[p.id]; if(it.wall) return 10; if(it.back) return 20; if(it.rug) return 50; return (it.top?2000:100)+Math.round((p.y+hPct(p))*10);};
const scene=()=>SCENES[state.scene];
function room(){
  const id=state.scene, key=roomKey(id), k=kScale();
  if(!state.rooms[key]) state.rooms[key]={wall:0,floor:0,night:false,placed:SCENES[id].start.map(spec=>{
    const p={uid:uidN++,id:spec.id,w:(spec.w||BY[spec.id].w)*k,flip:false,view:"front"};
    const cx=50+(spec.cx-50)*(k<1?1:Math.min(1,1/k*1.05));
    p.x=cx-p.w/2; p.y=spec.top!=null?spec.top:spec.bottom-hPct(p); return p;})};
  return state.rooms[key];
}
function save(){try{localStorage.setItem("cozyplaces",JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem("cozyplaces"));if(s&&s.rooms&&SCENES[s.scene])return s}catch(e){}return null}

function place(p){
  let el=itemsEl.querySelector(`[data-uid="${p.uid}"]`);
  if(!el){
    el=document.createElement("div");
    el.className="item";el.dataset.uid=p.uid;
    el.innerHTML=`<div class="flip">${artOf(p)}</div>`;
    if(BY[p.id].glow) el.classList.add("glow");
    el.addEventListener("pointerdown",startDrag);
    itemsEl.appendChild(el);
  }
  el.style.left=p.x+"%";el.style.top=p.y+"%";el.style.width=p.w+"%";
  el.style.zIndex=zOf(p);
  el.classList.toggle("flipped",!!p.flip);
  el.classList.toggle("sel",sel===p.uid);
}
function renderAll(){
  const sc=scene(), r=room();
  sel=null;
  stage.dataset.scene=state.scene;
  stage.style.aspectRatio=String(aspect());
  const wall=stage.querySelector(".wall"), floor=stage.querySelector(".floor");
  wall.style.height=sc.horizon+"%"; floor.style.top=sc.horizon+"%";
  wall.style.background=sc.wallBg(sc.walls[r.wall]||sc.walls[0]);
  floor.style.background=sc.floorBg(sc.floors[r.floor]||sc.floors[0]);
  $("scenery").innerHTML=sc.scenery;
  stage.classList.toggle("night",!!r.night);
  $("lights").textContent=r.night?"turn lights on ☀":"turn lights off ☾";
  $("wallLabel").textContent=sc.labels[0]; $("floorLabel").textContent=sc.labels[1];
  itemsEl.innerHTML="";
  r.placed=r.placed.filter(p=>BY[p.id]);
  r.placed.forEach(place);
  swatches($("walls"),sc.walls,"wall");swatches($("floors"),sc.floors,"floor");
  const inHome=!!sc.home;
  [...$("places").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===(inHome?"home":state.scene)));
  $("rooms").hidden=!inHome;
  $("rooms").querySelectorAll("[data-id]").forEach(b=>{b.hidden=!size().rooms.includes(b.dataset.id);b.setAttribute("aria-pressed",b.dataset.id===state.scene);});
  $("rooms").querySelectorAll("[data-size]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.size===(state.size||"medium")));
  if(inHome) state.homeRoom=state.scene;
  $("fridgeBtn").hidden=state.scene!=="kitchen";
  $("trayTitle").textContent=sc.trayTitle;
  renderTray();select(null);
}
function swatches(el,list,key){
  el.innerHTML="";
  list.forEach((c,i)=>{const b=document.createElement("button");b.className="sw";b.style.background=c;b.setAttribute("aria-label",key+" color "+(i+1));
    b.setAttribute("aria-pressed",room()[key]===i);
    b.onclick=()=>{room()[key]=i;const sc=scene();
      if(key==="wall")stage.querySelector(".wall").style.background=sc.wallBg(c);else stage.querySelector(".floor").style.background=sc.floorBg(c);
      [...el.children].forEach((x,j)=>x.setAttribute("aria-pressed",j===i));save();};
    el.appendChild(b);});
}
function renderTray(){
  const tray=$("tray");tray.innerHTML="";
  scene().groups.forEach(([g,ids])=>{
    const sec=document.createElement("div");sec.className="group";sec.innerHTML=`<h3>${g}</h3>`;
    const grid=document.createElement("div");grid.className="tray";
    ids.forEach(id=>{const it=BY[id];const b=document.createElement("button");b.className="tile";
      b.innerHTML=`<div class="pic">${S[id]}</div><span>${it.name}</span>`;b.setAttribute("aria-label",`add ${it.name}`);
      b.addEventListener("click",()=>add(id));grid.appendChild(b);});
    sec.appendChild(grid);tray.appendChild(sec);
  });
}
function renderPlaces(){
  const box=$("places");
  ORDER.forEach(id=>{const b=document.createElement("button");b.dataset.id=id;
    b.innerHTML=`${S[ICONS[id]]}<span>${id==="home"?"home":SCENES[id].name}</span>`;
    b.onclick=()=>{const to=id==="home"?(size().rooms.includes(state.homeRoom)?state.homeRoom:size().rooms[0]):id;if(state.scene===to)return;state.scene=to;room();renderAll();save();};
    box.appendChild(b);});
  const rb=$("rooms"), sz=$("sizes");
  Object.keys(HOUSE).forEach(k=>{const b=document.createElement("button");b.dataset.size=k;b.textContent=HOUSE[k].label;
    b.onclick=()=>{if((state.size||"medium")===k)return;state.size=k;
      if(!HOUSE[k].rooms.includes(state.scene)) state.scene=HOUSE[k].rooms.includes(state.homeRoom)?state.homeRoom:HOUSE[k].rooms[0];
      room();renderAll();save();toast(`welcome to your ${k} house ☁`);};
    sz.appendChild(b);});
  HOME_ROOMS.forEach(id=>{const b=document.createElement("button");b.dataset.id=id;
    b.innerHTML=`${S[SCENES[id].icon]}<span>${SCENES[id].name}</span>`;
    b.onclick=()=>{if(state.scene===id)return;state.scene=id;room();renderAll();save();};
    rb.appendChild(b);});
}
function select(uid){
  sel=uid;
  itemsEl.querySelectorAll(".item").forEach(e=>e.classList.toggle("sel",+e.dataset.uid===uid));
  ["smaller","bigger","flipBtn","turnBtn","remove"].forEach(b=>$(b).disabled=uid===null);
}
function add(id){
  const it=BY[id];
  const p={uid:uidN++,id,w:it.w*kScale(),flip:false,view:"front",x:0,y:0};
  const jit=(Math.random()-.5)*16, hz=scene().horizon;
  p.x=Math.max(0,Math.min(100-p.w,50-p.w/2+jit));
  p.y=it.wall?Math.max(2,Math.min(hz-hPct(p)-4,10+Math.random()*8)):(it.rug?hz+14+Math.random()*8:Math.max(hz-20,92-hPct(p)+(Math.random()*4)));
  room().placed.push(p);
  place(p);select(p.uid);save();
}
function current(){return room().placed.find(p=>p.uid===sel)}

let drag=null;
function startDrag(e){
  const uid=+e.currentTarget.dataset.uid, p=room().placed.find(q=>q.uid===uid);
  e.preventDefault();e.stopPropagation();select(uid);
  e.currentTarget.setPointerCapture(e.pointerId);
  drag={p,el:e.currentTarget,sx:e.clientX,sy:e.clientY,x:p.x,y:p.y,r:stage.getBoundingClientRect()};
  e.currentTarget.addEventListener("pointermove",moveDrag);
  e.currentTarget.addEventListener("pointerup",endDrag);
  e.currentTarget.addEventListener("pointercancel",endDrag);
}
function moveDrag(e){
  if(!drag)return;
  const {p,r}=drag, h=hPct(p);
  p.x=Math.max(-p.w*.3,Math.min(100-p.w*.7,drag.x+(e.clientX-drag.sx)/r.width*100));
  p.y=Math.max(-h*.3,Math.min(100-h*.6,drag.y+(e.clientY-drag.sy)/r.height*100));
  place(p);
}
function endDrag(){
  if(!drag)return;const el=drag.el;
  el.removeEventListener("pointermove",moveDrag);el.removeEventListener("pointerup",endDrag);el.removeEventListener("pointercancel",endDrag);
  drag=null;save();
}
stage.addEventListener("pointerdown",e=>{if(!e.target.closest(".item"))select(null)});

function resize(f){const p=current();if(!p)return;const cx=p.x+p.w/2,by=p.y+hPct(p);p.w=Math.max(3,Math.min(80,p.w*f));p.x=cx-p.w/2;if(!BY[p.id].wall)p.y=by-hPct(p);place(p);save();}
$("smaller").onclick=()=>resize(.88);
$("bigger").onclick=()=>resize(1.12);
$("flipBtn").onclick=()=>{const p=current();if(!p)return;p.flip=!p.flip;place(p);save();};
$("turnBtn").onclick=()=>{
  const p=current();if(!p)return;
  const el=itemsEl.querySelector(`[data-uid="${p.uid}"]`);
  // front → side → other side → front (things with no side view just turn to face the other way)
  const swap=()=>{
    const h=hPct(p), cx=p.x+p.w/2, by=p.y+h;
    const vs=viewsOf(p.id);
    if(vs.length<2){p.flip=!p.flip;}
    else {let i=vs.findIndex(([v,fl])=>v===(p.view||"front")&&(v!=="side"||fl===!!p.flip));if(i<0)i=0;const [nv,nf]=vs[(i+1)%vs.length];p.view=nv;p.flip=nf;}
    p.w=Math.max(3,Math.min(80,h/(ratioOf(p)*4/3)));
    p.x=cx-p.w/2;p.y=by-hPct(p);
    el.querySelector(".flip").innerHTML=artOf(p);
    el.classList.remove("turning");place(p);save();
  };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){swap();return;}
  el.classList.add("turning");setTimeout(swap,200);
};
$("remove").onclick=()=>{const p=current();if(!p)return;const r=room();r.placed=r.placed.filter(q=>q!==p);itemsEl.querySelector(`[data-uid="${p.uid}"]`)?.remove();select(null);save();};
$("lights").onclick=()=>{const r=room();r.night=!r.night;stage.classList.toggle("night",r.night);$("lights").textContent=r.night?"turn lights on ☀":"turn lights off ☾";save();};
let clearT=null;
$("clear").onclick=()=>{
  const b=$("clear");
  if(!clearT){b.textContent="tap again to clear";b.classList.add("warn");clearT=setTimeout(()=>{b.textContent="start over";b.classList.remove("warn");clearT=null},3000);return;}
  clearTimeout(clearT);clearT=null;b.textContent="start over";b.classList.remove("warn");
  room().placed=[];renderAll();save();toast(`a fresh, empty ${scene().name} ☁`);
};

};
const FCAT=["dairy","drinks","jars","treats","fruit","veggies"];
const FCAT_NAME={dairy:"dairy",drinks:"drinks",jars:"jars",treats:"treats",fruit:"fruit",veggies:"veggies"};
for(const k in FOOD){FOOD[k][2]=Math.round(FOOD[k][2]*1.55*10)/10;}
for(const k in FOOD){const m=FOOD[k][3].match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);FOOD[k].push(m[2]/m[1]);}
const fin=$("fin"), foodsEl=$("foods");
let fsel=null, fuid=1;
const fH=f=>f.w*FOOD[f.id][4]*0.75;
function fridge(){if(!state.fridge){state.fridge=[];[["milk",6,24],["juice",22,24],["eggs",40,47],["cheese",70,47],["strawberries",6,72],["jam",30,72],["carrots",4,97],["broccoli",54,97],["lettuce",74,97]].forEach(([id,x,b])=>{const f={uid:fuid++,id,w:FOOD[id][2],x};f.y=b-fH(f)-0.3;state.fridge.push(f);});}return state.fridge;}
function placeFood(f){
  let el=foodsEl.querySelector(`[data-uid="${f.uid}"]`);
  if(!el){el=document.createElement("div");el.className="food";el.dataset.uid=f.uid;el.innerHTML=FOOD[f.id][3];
    el.setAttribute("aria-label",FOOD[f.id][0]);el.addEventListener("pointerdown",fStart);foodsEl.appendChild(el);}
  el.style.left=f.x+"%";el.style.top=f.y+"%";el.style.width=f.w+"%";el.style.zIndex=10+Math.round((f.y+fH(f))*10);
  el.classList.toggle("sel",fsel===f.uid);
}
function fSelect(uid){fsel=uid;foodsEl.querySelectorAll(".food").forEach(e=>e.classList.toggle("sel",+e.dataset.uid===uid));$("fOut").disabled=uid===null;}
function renderFridge(){foodsEl.innerHTML="";fridge().forEach(f=>{fuid=Math.max(fuid,f.uid+1);placeFood(f);});fSelect(null);}
function renderFTray(){
  const box=$("fTray");box.innerHTML="";
  FCAT.forEach(c=>{const sec=document.createElement("div");sec.className="group";sec.innerHTML=`<h3>${FCAT_NAME[c]}</h3>`;
    const g=document.createElement("div");g.className="tray ftray";
    for(const id in FOOD){if(FOOD[id][1]!==c)continue;const b=document.createElement("button");b.className="tile";
      b.innerHTML=`<div class="pic">${FOOD[id][3]}</div><span>${FOOD[id][0]}</span>`;b.setAttribute("aria-label",`put ${FOOD[id][0]} in the fridge`);
      b.onclick=()=>addFood(id);g.appendChild(b);}
    sec.appendChild(g);box.appendChild(sec);});
}
function addFood(id){
  const f={uid:fuid++,id,w:FOOD[id][2],x:0,y:0};
  const veg=FOOD[id][1]==="veggies"||FOOD[id][1]==="fruit"&&Math.random()<.3;
  const b=veg?97:[24,47,72][Math.floor(Math.random()*3)];
  f.x=veg?(Math.random()*(96-f.w)+2):(Math.random()*(94-f.w)+3);f.y=b-fH(f)-0.3;
  fridge().push(f);placeFood(f);fSelect(f.uid);save();
}
let fd=null;
function fStart(e){
  const uid=+e.currentTarget.dataset.uid,f=fridge().find(q=>q.uid===uid);
  e.preventDefault();fSelect(uid);e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.classList.add("dragging");
  fd={f,el:e.currentTarget,sx:e.clientX,sy:e.clientY,x:f.x,y:f.y,r:fin.getBoundingClientRect()};
  e.currentTarget.addEventListener("pointermove",fMove);e.currentTarget.addEventListener("pointerup",fEnd);e.currentTarget.addEventListener("pointercancel",fEnd);
}
function fMove(e){if(!fd)return;const {f,r}=fd;
  f.x=Math.max(0,Math.min(100-f.w,fd.x+(e.clientX-fd.sx)/r.width*100));
  f.y=Math.max(0,Math.min(100-fH(f),fd.y+(e.clientY-fd.sy)/r.height*100));placeFood(f);}
function fEnd(){if(!fd)return;const {f,el}=fd;el.classList.remove("dragging");
  // settle gently onto the shelf just below
  const bottom=f.y+fH(f), shelves=[24,47,72,97], land=shelves.find(s=>s>=bottom-2)||97;
  f.y=land-fH(f)-0.3;placeFood(f);
  el.removeEventListener("pointermove",fMove);el.removeEventListener("pointerup",fEnd);el.removeEventListener("pointercancel",fEnd);fd=null;save();}
fin.addEventListener("pointerdown",e=>{if(!e.target.closest(".food"))fSelect(null)});
$("fTidy").onclick=()=>{
  // dairy & drinks up top, jars & treats in the middle, fruit on the low shelf, veggies in the drawers
  const rows=[["drinks","dairy"],["jars","treats","dairy"],["fruit","treats"],["veggies","fruit"]];
  const bottoms=[24,47,72,97], used=[2,2,2,3], all=[...fridge()];
  all.sort((a,b)=>FCAT.indexOf(FOOD[a.id][1])-FCAT.indexOf(FOOD[b.id][1])||a.id.localeCompare(b.id));
  all.forEach(f=>{const c=FOOD[f.id][1];let r=rows.findIndex((row,i)=>row[0]===c&&used[i]+f.w<=98);
    if(r<0)r=rows.findIndex((row,i)=>row.includes(c)&&used[i]+f.w<=98);
    if(r<0)r=used.findIndex(u=>u+f.w<=98);if(r<0)r=3;
    f.x=Math.min(used[r],100-f.w);used[r]+=f.w+1.5;f.y=bottoms[r]-fH(f)-0.3;placeFood(f);});
  save();toast("all tidy and neat ✨");
};
$("fOut").onclick=()=>{const i=fridge().findIndex(f=>f.uid===fsel);if(i<0)return;foodsEl.querySelector(`[data-uid="${fsel}"]`)?.remove();fridge().splice(i,1);fSelect(null);save();};
let fEmptyT=null;
$("fEmpty").onclick=()=>{const b=$("fEmpty");
  if(!fEmptyT){b.textContent="tap again to empty";b.classList.add("warn");fEmptyT=setTimeout(()=>{b.textContent="empty fridge";b.classList.remove("warn");fEmptyT=null},3000);return;}
  clearTimeout(fEmptyT);fEmptyT=null;b.textContent="empty fridge";b.classList.remove("warn");state.fridge=[];renderFridge();save();};
let lastFocus=null;
function openFridge(){lastFocus=document.activeElement;renderFridge();$("fridgeView").hidden=false;document.body.style.overflow="hidden";$("fClose").focus();}
function closeFridge(){$("fridgeView").hidden=true;document.body.style.overflow="";lastFocus?.focus?.();}
$("fridgeBtn").onclick=openFridge;$("fClose").onclick=closeFridge;
$("fridgeView").addEventListener("pointerdown",e=>{if(e.target.id==="fridgeView")closeFridge();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("fridgeView").hidden)closeFridge();});
renderFTray();
let tT;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2800);}

function start(data){
  state=(data&&data.state&&data.state.rooms)?data.state:(load()||{scene:"cafe",rooms:{}});
  for(const k in state.rooms) state.rooms[k].placed.forEach(p=>uidN=Math.max(uidN,p.uid+1));
  room();
  if(!$("places").children.length) renderPlaces();
  renderAll();
}
window.claude?.hot?.snapshot?.(()=>({state}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
